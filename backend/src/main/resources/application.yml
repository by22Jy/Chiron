server:
  port: 8080
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/yolo_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    driverClassName: com.mysql.cj.jdbc.Driver
    username: ${DB_USER:root}
    password: ${DB_PASS:Wangjiayi1}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  type-aliases-package: com.example.aiorchestrator.domain

# 标准化配置 - AC5: 配置同步机制
# 与agent/config.yaml保持一致的配置标准
enumerations:
  status-values: success,error,processing  # 小写状态枚举
  action-types: hotkey,mouse,click,scroll,text,window,system  # 小写动作类型
  gesture-names: POINT_UP,THUMBS_UP,VICTORY,OK_SIGN,CLOSED_FIST,V_GESTURE,ROCK_SIGN  # 大写下划线手势名

data-format:
  timestamp-format: "ISO_8601"
  response-structure:
    status: "success|error"
    data: "object"
    message: "string"
    timestamp: "ISO_8601"

# 配置同步设置
sync:
  enabled: true
  validation: true
  hot-reload: true
ai:
  yolo:
    url-detect-file: http://127.0.0.1:8000/detect/file
    url-detect-url: http://127.0.0.1:8000/detect/url
  llm:
    provider: deepseek
    kimi:
      api-url: https://api.moonshot.cn/v1/chat/completions
      api-key: ${KIMI_API_KEY:change-me}
      model: moonshot-v1-8k
    qwen:
      api-url: https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
      api-key: ${QWEN_API_KEY:change-me}
      model: qwen-plus
    glm:
      api-url: https://open.bigmodel.cn/api/paas/v4/chat/completions
      api-key: ${ZAI_API_KEY:${ANTHROPIC_AUTH_TOKEN:change-me}}
      model: glm-4.5
    deepseek:
      api-url: https://api.deepseek.com/chat/completions
      api-key: ${DEEPSEEK_API_KEY:}
      model: deepseek-chat

# MCP服务器配置
mcp:
  server:
    url: ${MCP_SERVER_URL:http://localhost:8083}
    timeout: 30000




